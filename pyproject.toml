[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "gpubox-cli"
version = "0.1.1"
description = "Customer-facing CLI for GPUBox — UK-sovereign AI inference (api.gpubox.ai)"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "FrontendLabs", email = "support@gpubox.ai" }]
maintainers = [{ name = "FrontendLabs", email = "support@gpubox.ai" }]
requires-python = ">=3.10"
keywords = ["gpubox", "cli", "ai", "inference", "llm", "embeddings", "whisper"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "tomli>=2.0.1; python_version<'3.11'",
    "tomli-w>=1.0.0",
    "prompt-toolkit>=3.0.43",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "respx>=0.21.1",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.urls]
Homepage = "https://gpubox.ai"
Documentation = "https://github.com/FrontendLabs-UK/gpubox-cli#readme"
Repository = "https://github.com/FrontendLabs-UK/gpubox-cli"
Issues = "https://github.com/FrontendLabs-UK/gpubox-cli/issues"

[project.scripts]
# Both names go through main_entry which wraps the typer app with our
# GPUBoxError handler, so installed binaries get clean exit codes — not
# just the unit-tested CliRunner path. Per Codex review.
gpb = "gpubox_cli.main:main_entry"
gpubox = "gpubox_cli.main:main_entry"

[tool.hatch.build.targets.wheel]
packages = ["src/gpubox_cli"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]
# E501: long lines (we use 100 char limit but tolerate URLs/comments).
# B008: typer/click REQUIRE function calls in arg defaults (typer.Option(...))
#       — suppressing globally because every command file would need a noqa.
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
